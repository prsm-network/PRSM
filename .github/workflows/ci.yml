name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Concurrency policy (sprint 949):
#   - PR / feature-branch pushes: cancel superseded in-progress runs — only the
#     latest commit matters there, and cancelling saves runner minutes.
#   - main: NEVER cancel, and give every commit its OWN concurrency group
#     (keyed by sha) so a rapid direct-push cadence cannot cancel in-flight runs.
#     Before this, `cancel-in-progress: true` with a shared `ci-main` group meant
#     each new push to main cancelled the previous run mid-flight: 37 of the last
#     40 main runs were `cancelled` (0 success), so main CI never reported a
#     green/red verdict and a real test regression sat undetected for 16 commits
#     (sp927 -> sp943). Every commit to the protected branch must get a complete
#     verdict. (Cost: main runs can overlap under a fast cadence — fine for a
#     20-min-capped suite. If runner minutes get tight, switch main back to a
#     shared group `ci-main` with cancel-in-progress:false to SERIALIZE instead.)
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default to a read-only token — specific jobs opt into more if they need it.
permissions:
  contents: read

jobs:

  # ───────────────────────────────────────────────────────────────
  # Python: tests + coverage on a 3.11 / 3.12 matrix
  # ───────────────────────────────────────────────────────────────
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests with coverage
        # -m "not e2e" deselects 42 E2E tests that require live P2P
        # infrastructure (libp2p Go library + WebSocket ports + peer-ID
        # multiaddr fixtures). Run locally with `pytest -m e2e` after
        # building libp2p shared library via `make -C libp2p build`.
        # See pytest.ini § markers for the full rationale.
        #
        # sp1418 — "not docker" deselects the two LIVE image build/run guards. They are NOT dropped:
        # they run once in the dedicated `docker-image` job below. Keeping them here would build the
        # SAME python:3.11-slim + torch image once per matrix leg (pure duplication, the image does
        # not depend on the host Python) and blow this job's 20-minute cap.
        run: pytest -m "not e2e and not docker" --timeout=120 --cov=prsm --cov-report=xml --cov-report=term -q

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ───────────────────────────────────────────────────────────────
  # Docker image: the LOAD-BEARING deployability guards (sprint 1418).
  #
  # tests/unit/test_enterprise_docker.py's two live tests actually
  # `docker build` deploy/enterprise-demo and `docker run` the demo
  # inside it ("if this fails, the file-level artifacts are not
  # actually deployable"). Nothing else builds this image — deploy.yml
  # does not.
  #
  # They had NEVER executed in CI: collection aborted for months, and
  # once it didn't, the unit lane's --timeout=120 killed a test whose
  # own subprocess budget is 900s (a cold `pip install torch` inside
  # the image is slow). Rather than drop a real guard to get green,
  # they get their own job: ONE build (not once per Python leg — the
  # image is python:3.11-slim regardless of host Python) with a budget
  # that matches reality.
  # ───────────────────────────────────────────────────────────────
  docker-image:
    name: Docker image (build + demo boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Same install as the test matrix. A trimmed install is tempting (the
        # image builds its OWN deps), but tests/conftest.py imports prsm inside
        # fixtures and pytest.ini requires --strict-config + asyncio_mode=auto,
        # so a partial env risks a broken job rather than a real signal.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Build image + boot the demo inside it
        run: pytest -m docker tests/unit/test_enterprise_docker.py -v -p no:cacheprovider

  # ───────────────────────────────────────────────────────────────
  # Lint: ruff + mypy — ADVISORY for now.
  #
  # The codebase has ~47k pre-existing ruff findings (mostly formatting-
  # style) plus mypy debt on legacy modules outside the per-module
  # strict tier in pyproject.toml. Running these as hard gates today
  # would block every PR. Running them as advisory surfaces the debt
  # without blocking velocity. Follow-up tasks to ratchet lint/mypy to
  # blocking:
  #   1. Exclude tests/_legacy/ from ruff explicitly in pyproject.toml
  #   2. Run `ruff check --fix` + `ruff format` across prsm/ in a
  #      dedicated "formatting baseline" commit
  #   3. Expand the pyproject.toml mypy per-module strict-tier list as
  #      more modules are cleaned
  #   4. Flip `|| true` to hard-fail below
  # ───────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy) [advisory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Ruff check (advisory)
        run: ruff check prsm/ || true

      - name: Ruff format check (advisory)
        run: ruff format --check prsm/ || true

      - name: Mypy (per-module strict tiers per pyproject.toml; advisory)
        run: mypy prsm/ || true

  # ───────────────────────────────────────────────────────────────
  # Solidity: hardhat tests for smart contracts
  # ───────────────────────────────────────────────────────────────
  solidity-tests:
    name: Solidity tests (hardhat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run hardhat tests
        run: npx hardhat test

  # ───────────────────────────────────────────────────────────────
  # Security: fast static + dependency scans (advisory, non-blocking today)
  # ───────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (static application security testing)
        run: bandit -r prsm/ -ll -x tests/,prsm/tests/ || true
        # Non-blocking for now — bandit surfaces advisory findings.
        # Ratchet to fail-on-findings once the baseline is clean.

      - name: pip-audit (dependency CVE scan)
        run: pip-audit -r requirements.txt --skip-editable || true
        # Non-blocking for now — dependency CVE findings need triage,
        # not auto-block. Move to fail-on-HIGH once reviewed.

  # ───────────────────────────────────────────────────────────────
  # Summary gate: single status for branch protection / PR gating
  # ───────────────────────────────────────────────────────────────
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [python-tests, lint, solidity-tests, security-scan]
    if: always()
    steps:
      - name: Check upstream job results
        run: |
          set -e
          tests_result="${{ needs.python-tests.result }}"
          lint_result="${{ needs.lint.result }}"
          sol_result="${{ needs.solidity-tests.result }}"
          sec_result="${{ needs.security-scan.result }}"
          echo "python-tests:   $tests_result   (blocking)"
          echo "lint:           $lint_result   (advisory — does not block CI status)"
          echo "solidity-tests: $sol_result   (blocking)"
          echo "security-scan:  $sec_result   (blocking)"
          # Lint is advisory while the pre-existing ruff/mypy debt is
          # being paid down. Only the three real gates block CI status.
          if [[ "$tests_result" != "success" || "$sol_result" != "success" || "$sec_result" != "success" ]]; then
            echo "::error::A blocking CI job failed; see individual job logs"
            exit 1
          fi
          echo "All blocking CI jobs passed (lint status: $lint_result, advisory)"

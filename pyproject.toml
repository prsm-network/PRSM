# PRSM - Protocol for Research, Storage, and Modeling
# Modern Python packaging configuration

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prsm-network"
version = "1.7.0"
description = "Protocol for Research, Storage, and Modeling - A P2P infrastructure protocol for open-source collaboration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PRSM Team", email = "team@prsm-network.com"}
]
maintainers = [
    {name = "PRSM Team", email = "team@prsm-network.com"}
]
keywords = [
    "scientific-modeling",
    "ai",
    "decentralized",
    "p2p",
    "research",
    "federation",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    # Core Web Framework
    "fastapi>=0.104.0,<0.140.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    
    # Database & Storage
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    
    # Logging & CLI
    "structlog>=23.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "simple-term-menu>=1.6.0",
    "python-dotenv>=1.0.0",
    
    # HTTP & Networking
    "httpx>=0.25.0",
    "websockets>=12.0",
    
    # Security
    "cryptography>=41.0.0",
    "pyasn1>=0.5.0",  # DER decoding of TEE attestation TCB extensions (sgx_tcb / amd_tcb)
    "asn1crypto>=1.5.0",  # sp1336 — lenient X.509 fallback for AMD's non-positive-serial VCEK/ARK certs
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "passlib>=1.7.4",
    "pynacl>=1.5.0",
    "eth-utils>=2.0.0",   # keccak256 for Phase 2 shard receipts + Phase 7 on-chain slashing

    # Monitoring & Metrics
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",

    # Dashboard
    "streamlit>=1.28.0",

    # sp1375 — cap <2.0: numpy 2.x's C-ABI break silently kills torch's numpy bridge
    # ("_ARRAY_API not found" / "Numpy is not available") on any box whose torch was built
    # against numpy 1.x (e.g. GPU images with a preinstalled torch). numpy 1.x is fully
    # compatible with torch 2.x + transformers 4.x; caught live on the 2026-07-04 GPU canary.
    "numpy>=1.24.0,<2.0",

    # Async file I/O (required by IPFS client)
    "aiofiles>=23.0.0",

    # Bencode (PyPI-installable; used by the BitTorrent
    # manifest layer alongside the system `libtorrent`
    # binding). Sprint 425 — pulled out of the `[bittorrent]`
    # optional extra into required deps so the BT manifest
    # store works even when libtorrent itself isn't yet
    # installed (operator can install libtorrent later and
    # the rest of the BT layer is already pip-available).
    "bencodepy>=0.9",

    # Reed-Solomon erasure coding — required for the
    # Phase 7-storage erasure module (prsm/storage/erasure.py
    # imports unconditionally at line 38). Sprint 459 (F16)
    # moved this from the [blockchain] extra into required
    # deps so node startup doesn't crash with
    # ModuleNotFoundError: No module named 'zfec' on fresh
    # operator installs. Caught during sprint 458's
    # bootstrap1 deploy.
    "zfec>=1.5.8",

    # ── Sprint 461 dep-audit additions (F17 + siblings) ─────
    # Six deps that PRSM's core code imports at module top-
    # level but were undeclared in pyproject.toml. Caught by
    # sprint 461's grep-all-imports-vs-declared-deps audit
    # (Path A — close the dep-bug class that surfaced F15/F16
    # /F17/F18 during bootstrap1 deploys). Each entry below
    # cites the top-level import site that requires it.

    # pycryptodome — Shamir secret-sharing for Tier B/C key
    # distribution. Imported at prsm/storage/key_sharing.py:39
    # by `from Crypto.Protocol.SecretSharing import Shamir`.
    # F17 — surfaced during sprint 458's bootstrap1 deploy
    # (workaround was direct pip install; this is the
    # permanent fix).
    "pycryptodome>=3.19.0",

    # PyYAML — required by 4+ config loaders at top-level
    # (prsm/core/config/manager.py:11, loaders.py:11,
    # model_config_manager.py:18, compute/performance/
    # scaling.py:15). The most-load-bearing missing dep —
    # config-load is on EVERY node-start path.
    "pyyaml>=6.0",

    # python-jose — JWT handling in enhanced authentication
    # (prsm/core/security/enhanced_authentication.py:11).
    # Siblings: pyjwt is already declared at line 75; jose
    # is the auth-middleware library used in parallel.
    "python-jose>=3.3.0",

    # networkx — graph algorithms used by federation
    # topology + agent-based economic model + selective
    # parallelism engine. Top-level imports in three
    # core modules; node-startup path hits at least one.
    "networkx>=3.0",

    # starlette — FastAPI's underlying ASGI lib. Imported
    # explicitly by prsm/api/auth_middleware.py:16-17 and
    # prsm/node/api_hardening.py:27-29 for the canonical
    # BaseHTTPMiddleware / Request / Response classes.
    # Defensively-declared even though fastapi pulls it in
    # transitively — explicit avoids version-skew surprises.
    "starlette>=0.27.0",

    # eth-abi — ABI encoding for the on-chain settlement
    # merkle proofs (prsm/settlement/merkle.py:30).
    # Sibling to web3 + eth-account (both in [blockchain]
    # extra) but used at top-level by the settlement
    # module which is on the core startup path.
    "eth-abi>=4.0.0",

    # bleach — HTML sanitization for input validation.
    # F19 fix (sprint 462): was in [server] extra but
    # prsm/core/security/input_sanitization.py:12 imports
    # at top-level + the security package re-exports it
    # via __init__.py, so it's on the node-startup path.
    # Same class as F16 (zfec in [blockchain] extra) —
    # moved to required deps.
    "bleach>=6.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "coverage[toml]>=7.0.0",
    
    # Code Quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    
    # Security
    "bandit>=1.7.0",
    "safety>=2.3.0",
    
    # Documentation
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
    
    # Build & Release
    "build>=1.0.0",
    "twine>=4.0.0",
    "setuptools-scm>=8.0.0",
]

ml = [
    # Machine Learning
    "torch>=2.0.0",
    # sp1375 — cap <5.0: transformers 5.x changed the model-class registration/import so the
    # slice-load runner fails "Could not import module 'Qwen2ForCausalLM'" on a real model.
    # 4.x supports Qwen2.5/Llama/Mistral etc.; caught live on the 2026-07-04 GPU canary.
    "transformers>=4.35.0,<5.0",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    # sp1209 — instruct-model chat templates (apply_chat_template, sp1204/sp1208) render
    # via jinja2; transformers requires >=3.1.0 or inference fails on a fresh box that
    # only has an older distro jinja2 (the Lambda A10 bench hit exactly this).
    "jinja2>=3.1.0",
]

blockchain = [
    # Ethereum / Polygon Web3 integration
    "web3>=6.0.0",
    "eth-account>=0.9.0",
    "hexbytes>=0.3.0",
    "siwe>=4.4.0",  # EIP-4361 Sign-In With Ethereum (Phase 4)
    # zfec moved to required deps in sprint 459 (F16 fix —
    # erasure.py imports unconditionally; node startup crashed
    # with ModuleNotFoundError on fresh installs).
]

vectorstore = [
    # Milvus (self-hosted or Zilliz cloud)
    "pymilvus>=2.3.0",
    # Qdrant (self-hosted or cloud)
    "qdrant-client>=1.7.0",
    # Pinecone (cloud only)
    "pinecone-client>=3.0.0",
]

wasm = [
    "wasmtime>=22.0.0",
]

gpu = [
    # GPU monitoring and detection (optional - for GPU-equipped systems)
    "nvidia-ml-py3>=12.0.0",
    "GPUtil>=1.4.0",
]

distillation = [
    # 8-bit quantization for large teacher models
    "bitsandbytes>=0.41.0",
    # device_map="auto" for model loading
    "accelerate>=0.24.0",
]

bittorrent = [
    # The `libtorrent` Python binding is a SYSTEM-LEVEL
    # dependency on most platforms — `pip install libtorrent`
    # does NOT work because the PyPI name resolves to an
    # unrelated/unmaintained package. Install via the
    # platform-native channel:
    #   macOS:    brew install libtorrent-rasterbar
    #             (drops `libtorrent.so` into site-packages)
    #   Debian:   apt install python3-libtorrent
    #   Fedora:   dnf install rb_libtorrent-python3
    # See `docs/PARTICIPANT_GUIDE.md` "Installing the
    # BitTorrent layer" sub-section for the canonical
    # per-platform install steps (sprint 425).
    # This extra is intentionally empty of `libtorrent`
    # itself — listing it here would cause `pip install
    # prsm-network[bittorrent]` to fail.
    "bencodepy>=0.9",
]

server = [
    # Full API server dependencies (optional routers).
    # bleach moved to required deps in sprint 462 (F19 fix —
    # input_sanitization.py imports at top-level, on
    # node-startup path via core/security/__init__).
    "psutil>=5.9.0",
    "jinja2>=3.1.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.6",
    "pandas>=2.0.0",
]

mcp = [
    # MCP server for AI agent integration.
    # `mcp` is the official SDK (imported directly by prsm/mcp_server.py).
    # `fastmcp` is an optional high-level wrapper.
    "mcp>=1.27.0",
    "fastmcp>=2.0.0",
]

all = [
    "prsm[dev,ml,blockchain,vectorstore,gpu,distillation,bittorrent,server,mcp]",
]

[project.scripts]
prsm = "prsm.cli:main"

[project.urls]
Homepage = "https://github.com/prsm-network/PRSM"
Documentation = "https://prsm.readthedocs.io"
Repository = "https://github.com/prsm-network/PRSM.git"
Issues = "https://github.com/prsm-network/PRSM/issues"
Changelog = "https://github.com/prsm-network/PRSM/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["prsm*"]
exclude = [
    "prsm.compute.nwtn.corpus*",
    "prsm.compute.nwtn.processed_corpus*",
    "prsm.compute.nwtn.logs*",
    "tests*",
    "examples_and_demos*",
    "build*",
    "dist*",
    "contracts*",
    "sdks*",
    "docs*",
    "scripts*",
    "planning*",
    "docker*",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# sp1480 — every path here is loaded at RUNTIME by code in prsm/. The wheel is
# built with include-package-data = false, so anything missing from this list is
# silently un-shipped: the source tree works, CI (which runs from source) stays
# green, and only a `pip install prsm-network` user sees the dead surface. That
# is exactly how the dashboard, the onboarding wizard, the WASM executor and the
# model catalog shipped broken. tests/unit/test_sprint_1480_wheel_assets.py walks
# the BUILT wheel and fails if any runtime-loaded asset is absent — keep that
# test passing rather than trusting this list by eye.
prsm = [
    "*.py", "*/*.py", "*/*/*.py",
    # NOTE: "py.typed" was listed here but prsm/py.typed does not exist, so the
    # glob shipped nothing. Not creating the marker as a drive-by: [tool.mypy]
    # enforces strict typing only on new + audited modules, so a PEP 561 marker
    # would tell downstream type-checkers the WHOLE package is typed. Adding it
    # is a deliberate typing-completeness decision, not a packaging fix.
    # Operator dashboard — prsm/dashboard/app.py Jinja2Templates + the
    # /static mount in prsm/node/api.py (_DASHBOARD_STATIC).
    "dashboard/templates/*.html",
    "dashboard/static/css/*.css",
    "dashboard/static/js/*.js",
    # Onboarding wizard + docs UI — prsm/interface/api/onboarding_router.py
    # and docs_ui.py both Jinja2Templates(Path(__file__).parent/"templates").
    # The wizard's 8 step templates are NESTED under onboarding/ and a bare
    # "*.html" does NOT reach them (setuptools globs do not cross separators) —
    # that omission is what made /onboarding/ 500 on the wheel.
    "interface/api/templates/*.html",
    "interface/api/templates/onboarding/*.html",
    # Real WASM executor binaries (sp1177) — compute/wasm loads these at runtime.
    "compute/wasm/binaries/*.wasm",
    # Model catalog / pricing / providers / capability maps.
    "core/config/models/*.yaml",
    "data/*.yaml",
    # Built-in skills. NOTE the previous "skills/*.yaml" glob matched NOTHING and
    # was removed — the real files are skills/builtins/<name>/SKILL.yaml.
    "skills/builtins/*/SKILL.yaml",
    "ui_mockup/*.html", "ui_mockup/css/*.css", "ui_mockup/js/*.js", "ui_mockup/assets/*",
    "compute/inference/vendor_anchors/*.pem",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "corpus/*", "processed_corpus/*", "logs/*",
    "*.db", "*.sqlite", "*.log", "*.jsonl",
    "__pycache__/*",
]

# === Testing Configuration ===
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=prsm",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "network: Tests requiring network access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["prsm"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.paths]
source = ["prsm"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
]
# Coverage gate lowered to 30% for 2026-04-24 CI-green baseline. Actual
# is 32.70% across 4103 tests. Ratchet back up as legacy modules are
# retired or covered. Target remains 70%+ for post-audit state.
fail_under = 30
show_missing = true

# === Code Quality Configuration ===
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip = [".git", ".hg", ".mypy_cache", ".tox", ".venv", "_build", "buck-out", "build", "dist", "migrations"]

[tool.mypy]
# Two-tier strictness model:
#  - Default: relaxed rules that match the pre-strict legacy surface
#    (~7000 mypy errors currently across 430 files — a multi-week
#    migration is out of scope for polish sprints). `check_untyped_defs`
#    still runs so bugs inside already-annotated regions are caught.
#  - Per-module overrides below enforce strict typing on new + audited
#    code paths. New modules should be added to the strict list once
#    they pass `mypy --follow-imports=skip <module>` clean.
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# Tests stay relaxed — fixture + mock code legitimately uses Any.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

# Strict-enforced modules. All clean under the full strict preset
# (warn_return_any + disallow_untyped_defs + disallow_incomplete_defs +
# disallow_untyped_decorators + warn_unused_ignores) as of 2026-04-23.
# Adding a module here is a one-way ratchet: if strict fails, either
# fix the regression or separately document why the entry needs to be
# removed.
[[tool.mypy.overrides]]
module = [
    "prsm.economy.payments.vendor_adapters",
    "prsm.economy.payments.withdrawal_orchestrator",
    "prsm.economy.web3.tx_lock_registry",
    "prsm.emission.emission_client",
    "prsm.emission.watcher",
    "prsm.interface.display",
    "prsm.interface.onboarding.siwe",
    "prsm.interface.onboarding.wallet_binding",
    "prsm.node.bootstrap",
    "prsm.node.liveness",
    "prsm.node.nat_traversal",
    "prsm.node.p2p_metrics",
    "prsm.node.rate_limit",
    "prsm.node.shard_streaming",
    "prsm.node.transport_adapter",
    "prsm.node.bootstrap_transport",
    "prsm.node.rpc_transport",
    "prsm.node.jurisdiction_filter",
    "prsm.node.content_self_filter",
    "prsm.storage.encryption",
    "prsm.storage.erasure",
    "prsm.storage.key_sharing",
    "prsm.storage.proof",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
    "ARG001", # unused function argument
]
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["ARG001", "S101"]

# === Changelog Configuration (git-cliff) ===
[tool.git-cliff.changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.username %} by @{{ commit.github.username }}{%- endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/PRSM-org/PRSM/issues/${2}))" },
]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(release\\): release version", skip = true },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "Miscellaneous Tasks" },
    { body = ".*security", group = "Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.1.0-beta.1"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

# === Bandit Security Configuration ===
[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]

# === Safety Configuration ===
[tool.safety]
ignore = []
